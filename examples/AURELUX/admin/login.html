<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="aurelux-api" content="">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Atelier Desk | AURELUX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-story" aria-label="AURELUX atelier">
      <a class="admin-brand" href="../index.html" aria-label="AURELUX home">
        <span class="admin-mark" aria-hidden="true">A</span>
        <span><b>AURELUX</b><small>HOROLOGIE · GENÈVE</small></span>
      </a>
      <div class="login-quote">
        <p class="admin-eyebrow"><span></span> PRIVATE WORKSPACE</p>
        <h1>Time is made<br><em>by hand.</em></h1>
        <p>A quiet place for the people who care for every detail.</p>
      </div>
      <span class="login-edition">ATELIER DESK <i>·</i> EST. 2009</span>
    </section>
    <section class="login-card">
      <p class="admin-eyebrow">WELCOME BACK</p>
      <h2>Sign in to<br><em>the atelier.</em></h2>
      <p class="login-intro">Your collection and client orders are waiting.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
        <button class="button button-gold login-submit" id="loginButton" type="submit">Enter the atelier <span aria-hidden="true">→</span></button>
      </form>
      <a class="login-return" href="../shop.html"><span aria-hidden="true">←</span> Return to the collection</a>
    </section>
  </main>
  <script type="module" src="./login.js"></script>
</body>
</html>
